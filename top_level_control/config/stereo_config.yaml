# Resolution - Basler acA1920-150uc default
frame_width: 1920
frame_height: 1200

# Left camera (Camera 0 in calibration - world origin)
camera_left:
  serial: ""  
# Right camera (Camera 1 in calibration)
camera_right:
  serial: ""  

# Note: If serial is empty "", camera will be selected by device index
# Left camera = index 0, Right camera = index 1
# Use test_single_camera.py --list to find serial numbers