# Stereo Camera Configuration for Arducam USB Cameras
# Uses OpenCV VideoCapture

# Resolution
frame_width: 1280
frame_height: 720

# Left camera (Camera 0 in calibration)
camera_left:
  id: 1  # USB camera device ID

# Right camera (Camera 1 in calibration)
camera_right:
  id: 2  # USB camera device ID

# Note: Camera IDs may change depending on USB port order
# Use test_stereo_detection.py to verify correct camera assignment
# Left camera should be Camera 0 (world origin in calibration)