# Calibration Settings for Basler acA1920-150uc Stereo Cameras


# Camera serial numbers (find using pylon Viewer or test_single_camera.py --list)
# Leave empty string "" to auto-select by device index (0 for camera0, 1 for camera1)
camera0: ""  
camera1: ""  

# Resolution - Basler acA1920-150uc default
frame_width: 1920
frame_height: 1200

# Calibration frame counts
mono_calibration_frames: 15
stereo_calibration_frames: 20

# Display scaling (1920x1200 is large, scale down for viewing)
view_resize: 2

checkerboard_box_size_scale: 3.17  # Square size in CM
checkerboard_rows: 4               # Inner corners horizontally
checkerboard_columns: 7            # Inner corners vertically

# Frame capture cooldown (frames between auto-captures)
cooldown: 100