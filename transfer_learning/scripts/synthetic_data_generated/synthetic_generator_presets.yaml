presets:
  broad:
    description: "Broad synthetic distribution with simpler sensing noise."
    generator:
      scan_duration_s: 1.5
      scan_dt_s: 0.005
      min_time_hit_s: 0.10
      gravity_z_mm_s2: -9810.0
      gravity_jitter_frac_std: 0.01
      obs_dt_min_s: 0.013
      obs_dt_max_s: 0.018
      obs_pre_hit_margin_s: 0.03
      obs_last_time_cap_s: 0.25
      max_attempts_factor: 60
      preview_duration_s: 2.5
      preview_dt_s: 0.005
      preview_stop_y_mm: -700.0
      preview_stop_z_mm: -1700.0
      table_z_mm: -1150.74
      table_length_mm: 2740.0
      table_width_mm: 1525.0
      max_bounces: 2
      preview_z_exaggeration: 1.8
    noise:
      position_std_mm: 3.0
      bias_std_mm: 1.5
      outlier_prob: 0.005
      outlier_std_mm: 10.0
      timestamp_jitter_ms: 0.5
    launch_box:
      x_min: -1062.5
      x_max: 1062.5
      y_min: 1940.0
      y_max: 3240.0
      z_min: -1150.74
      z_max: -450.74
    workspace:
      ellipse_a: 720.0
      ellipse_b: 470.0
      z_min: -1020.0
      z_max: -800.0
      robot_home: [0.0, 0.0, -900.0]
    real_match:
      enabled: false

  real_matched:
    inherits: broad
    description: "Narrower distribution to mimic observed real capture statistics."
    generator:
      gravity_jitter_frac_std: 0.02
      obs_dt_min_s: 0.0125
      obs_dt_max_s: 0.0210
      obs_last_time_cap_s: 0.35
      max_attempts_factor: 120
      max_bounces: 2
    noise:
      position_std_mm: 4.0
      bias_std_mm: 2.0
      outlier_prob: 0.01
      outlier_std_mm: 12.0
      timestamp_jitter_ms: 1.2
    launch_box:
      x_min: -450.0
      x_max: 750.0
      y_min: 2450.0
      y_max: 2750.0
      z_min: -1080.0
      z_max: -450.0
    real_match:
      enabled: true
      dt_mode: normal
      dt_mean_s: 0.0158
      dt_std_s: 0.0013
      dt_min_s: 0.0125
      dt_max_s: 0.0210
      require_valid_intercept: true
      require_reachable: true
