presets:
  broad:
    description: "Broad synthetic distribution with no-loss flight/bounce physics and simpler sensing noise."
    generator:
      k_points: 6
      scan_duration_s: 1.5
      scan_dt_s: 0.005
      min_time_hit_s: 0.10
      gravity_z_mm_s2: -9810.0
      gravity_jitter_frac_std: 0.01
      obs_dt_min_s: 0.013
      obs_dt_max_s: 0.018
      obs_pre_hit_margin_s: 0.03
      obs_last_time_cap_s: 0.25
      max_attempts_factor: 60
      preview_duration_s: 2.5
      preview_dt_s: 0.005
      preview_stop_y_mm: -700.0
      preview_stop_z_mm: -1700.0
      table_z_mm: -1150.74
      table_length_mm: 2740.0
      table_width_mm: 1525.0
      max_bounces: 2
      preview_z_exaggeration: 1.8
    noise:
      position_std_mm: 3.0
      bias_std_mm: 1.5
      outlier_prob: 0.005
      outlier_std_mm: 10.0
      timestamp_jitter_ms: 0.5
    launch_box:
      x_min: -1062.5
      x_max: 1062.5
      y_min: 1940.0
      y_max: 3240.0
      z_min: -1150.74
      z_max: -450.74
    workspace:
      ellipse_a: 720.0
      ellipse_b: 470.0
      z_min: -1020.0
      z_max: -800.0
      robot_home: [0.0, 0.0, -900.0]
    real_match:
      enabled: false

  clean_broad:
    inherits: broad
    description: "Broad launch/workspace coverage with near-deterministic measurements for model-capacity sanity checks."
    generator:
      gravity_jitter_frac_std: 0.0
      max_attempts_factor: 80
    noise:
      position_std_mm: 0.0
      bias_std_mm: 0.0
      outlier_prob: 0.0
      outlier_std_mm: 0.0
      timestamp_jitter_ms: 0.0
    real_match:
      enabled: false

  real_matched:
    inherits: broad
    description: "Real-like timing/noise with intentionally broader launch and trajectory diversity."
    generator:
      k_points: 6
      gravity_jitter_frac_std: 0.015
      obs_dt_min_s: 0.0130
      obs_dt_max_s: 0.0200
      obs_last_time_cap_s: 0.55
      max_attempts_factor: 180
      max_bounces: 2
    noise:
      position_std_mm: 3.5
      bias_std_mm: 1.8
      outlier_prob: 0.007
      outlier_std_mm: 10.0
      timestamp_jitter_ms: 0.9
    launch_box:
      x_min: -900.0
      x_max: 900.0
      y_min: 2150.0
      y_max: 3200.0
      z_min: -1150.74
      z_max: -520.0
    real_match:
      enabled: true
      dt_mode: normal
      dt_mean_s: 0.0159
      dt_std_s: 0.0013
      dt_min_s: 0.0130
      dt_max_s: 0.0200
      require_valid_intercept: true
      require_reachable: false
      second_bounce_prob: 0.35
      t_hit_min_s: 0.22
      t_hit_max_s: 1.20
      vx_scale: 0.55
      vy_scale: 0.62
      vz_scale: 0.45
      vz_bias_mm_s: 350.0
      vx_noise_std_mm_s: 140.0
      vy_noise_std_mm_s: 180.0
      vz_noise_std_mm_s: 150.0
